 <!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Race</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #fff;
      font-family: system-ui, sans-serif;
      background: linear-gradient(135deg, #101820, #243b45);
    }

    .game {
      width: min(100%, 380px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      letter-spacing: 2px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .game-area {
      position: relative;
      overflow: hidden;
      border: 4px solid #dce5e8;
      border-radius: 12px;
      background: #333;
      box-shadow: 0 14px 40px #0008;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      background: #071116d9;
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay h2 {
      margin: 0;
      font-size: 2rem;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      color: #fff;
      background: #ed563b;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff7055;
    }

    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 14px;
    }

    .controls button {
      width: 90px;
      font-size: 1.4rem;
      touch-action: manipulation;
      user-select: none;
    }

    .hint {
      margin: 10px 0 0;
      color: #d3e0e4;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="game">
    <h1>🏁 CAR RACE</h1>

    <div class="hud">
      <span>Punkte: <span id="score">0</span></span>
      <span>Bestwert: <span id="best">0</span></span>
    </div>

    <div class="game-area">
      <canvas id="canvas" width="360" height="600" aria-label="Autorennen-Spiel"></canvas>

      <div class="overlay" id="overlay" hidden>
        <h2>Crash! 💥</h2>
        <p>Deine Punkte: <strong id="final-score">0</strong></p>
        <button id="restart">Nochmal spielen</button>
      </div>
    </div>

    <div class="controls">
      <button id="left" aria-label="Nach links">⬅️</button>
      <button id="right" aria-label="Nach rechts">➡️</button>
    </div>

    <p class="hint">Steuerung: Pfeiltasten ← → oder Schaltflächen</p>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const bestElement = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const finalScoreElement = document.getElementById("final-score");

    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const laneWidth = WIDTH / 3;
    const carWidth = 48;
    const carHeight = 82;

    let player;
    let traffic;
    let score;
    let best = Number(localStorage.getItem("carRaceBest") || 0);
    let gameOver;
    let lastTime = 0;
    let spawnTimer = 0;
    let roadOffset = 0;

    bestElement.textContent = best;

    function startGame() {
      player = {
        lane: 1,
        x: laneWidth + (laneWidth - carWidth) / 2,
        y: HEIGHT - carHeight - 24
      };
      traffic = [];
      score = 0;
      gameOver = false;
      spawnTimer = 0;
      roadOffset = 0;
      scoreElement.textContent = score;
      overlay.hidden = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function movePlayer(direction) {
      if (gameOver) return;
      player.lane = Math.max(0, Math.min(2, player.lane + direction));
      player.x = player.lane * laneWidth + (laneWidth - carWidth) / 2;
    }

    function drawCar(x, y, color) {
      // Karosserie
      ctx.fillStyle = color;
      ctx.fillRect(x, y + 10, carWidth, carHeight - 20);

      // Dach und Fenster
      ctx.fillStyle = "#18252b";
      ctx.fillRect(x + 8, y + 22, carWidth - 16, 23);
      ctx.fillRect(x + 8, y + 51, carWidth - 16, 15);

      // Räder
      ctx.fillStyle = "#111";
      ctx.fillRect(x - 4, y + 19, 6, 18);
      ctx.fillRect(x + carWidth - 2, y + 19, 6, 18);
      ctx.fillRect(x - 4, y + 55, 6, 18);
      ctx.fillRect(x + carWidth - 2, y + 55, 6, 18);

      // Scheinwerfer
      ctx.fillStyle = "#fff2a6";
      ctx.fillRect(x + 5, y + 9, 10, 5);
      ctx.fillRect(x + carWidth - 15, y + 9, 10, 5);
    }

    function drawRoad() {
      ctx.fillStyle = "#3e4549";
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Straßenränder
      ctx.fillStyle = "#d9d9d9";
      ctx.fillRect(8, 0, 5, HEIGHT);
      ctx.fillRect(WIDTH - 13, 0, 5, HEIGHT);

      // Fahrbahnmarkierungen
      ctx.fillStyle = "#f4f0d0";
      for (let lane = 1; lane < 3; lane++) {
        const x = lane * laneWidth - 3;
        for (let y = -50 + roadOffset; y < HEIGHT; y += 90) {
          ctx.fillRect(x, y, 6, 48);
        }
      }
    }

    function rectanglesOverlap(a, b) {
      return a.x < b.x + carWidth - 8 &&
             a.x + carWidth > b.x + 8 &&
             a.y < b.y + carHeight - 10 &&
             a.y + carHeight > b.y + 10;
    }

    function endGame() {
      gameOver = true;
      best = Math.max(best, score);
      localStorage.setItem("carRaceBest", best);
      bestElement.textContent = best;
      finalScoreElement.textContent = score;
      overlay.hidden = false;
    }

    function gameLoop(now) {
      if (gameOver) return;

      const delta = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      const speed = 230 + Math.min(score * 3, 220);
      roadOffset = (roadOffset + speed * delta) % 90;

      spawnTimer += delta;
      const spawnInterval = Math.max(0.48, 1.05 - score * 0.008);

      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        const lane = Math.floor(Math.random() * 3);
        const colors = ["#4c9aff", "#f0b429", "#a66cff", "#49c68a", "#f05d5e"];

        traffic.push({
          lane,
          x: lane * laneWidth + (laneWidth - carWidth) / 2,
          y: -carHeight,
          color: colors[Math.floor(Math.random() * colors.length)],
          counted: false
        });
      }

      drawRoad();

      for (const car of traffic) {
        car.y += speed * delta;
        drawCar(car.x, car.y, car.color);

        if (rectanglesOverlap(player, car)) {
          endGame();
          return;
        }

        if (!car.counted && car.y > player.y + carHeight) {
          car.counted = true;
          score++;
          scoreElement.textContent = score;
        }
      }

      traffic = traffic.filter(car => car.y < HEIGHT + carHeight);

      drawCar(player.x, player.y, "#ed563b");
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
      }
      if (event.key === "ArrowLeft") movePlayer(-1);
      if (event.key === "ArrowRight") movePlayer(1);
    });

    document.getElementById("left").addEventListener("click", () => movePlayer(-1));
    document.getElementById("right").addEventListener("click", () => movePlayer(1));
    document.getElementById("restart").addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
